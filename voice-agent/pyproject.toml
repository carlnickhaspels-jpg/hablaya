[project]
name = "hablaya-voice-agent"
version = "0.1.0"
description = "LiveKit Agents voice worker voor de HablaYa Spaanse tutor (proof of concept)."
requires-python = ">=3.12,<3.13"
dependencies = [
  # Dezelfde versies als de bewezen Falcon-agent (uv.lock aldaar), exact vastgezet.
  "livekit-agents==1.8.4",
  "livekit-plugins-openai==1.8.4",
  "livekit-plugins-elevenlabs==1.8.4",
  "livekit-plugins-silero==1.8.4",
  "pydantic-settings>=2.14,<3",
]

[dependency-groups]
dev = [
  "pytest>=8.3.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hablaya_voice_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
